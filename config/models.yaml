# All listed providers use an OpenAI-compatible API. Change `active_provider`
# to switch the answer model without changing application code.
active_provider: qwen
providers:
  qwen:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    chat_model: qwen-plus
    embedding_model: text-embedding-v4
    embedding_dimensions: 1024
    # 检索距离阈值（1 - 余弦相似度）：最相似块距离超过该值时判定"未找到依据"。
    retrieval_threshold: 0.65
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    chat_model: deepseek-chat
    # DeepSeek currently does not provide embeddings. Keep embeddings on Qwen.
    embedding_provider: qwen
