    question: 员工购车有哪些补贴政策？
    expect_no_answer: true

  - id: neg-006
    category: negative
    question: 公司团建活动经费标准是多少？
    expect_no_answer: true

  - id: neg-007
    category: negative
    question: 员工心理咨询服务怎么预约？
    expect_no_answer: true

