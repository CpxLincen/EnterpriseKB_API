# 企业知识库综合评测集（多文档 / 多文档类型 / 多难度）
#
# 知识库 enterprise 包含 4 份文档、3 种类型：
#   employee-handbook.md  (Markdown，人事)
#   finance-policy.md     (Markdown，财务)
#   travel-policy.txt     (TXT，差旅)
#   it-policy.pdf         (PDF，IT 与办公设备)
#
# 字段说明：
#   knowledge_base      该题使用的知识库（可覆盖顶层默认值）
#   category            factual=事实型 / negative=无依据型
#   difficulty          L1=原文直问 / L2=同义改写 / L3=推理·档位边界·精确词面
#   expected_sources    预期命中的来源文件名
#   expected_facts      回答必须包含的关键事实（子串匹配，已忽略空白/大小写）
#   expected_chunk      答案所在正确块的特征子串（用于块级命中与 hit@k/MRR）
#   reference_answer    参考答案（供 --judge 语义判分）
#   expect_no_answer    true 表示该题知识库无依据，应被拒答
name: enterprise-eval-v1
knowledge_base: enterprise
cases:
  # ============ 人事（employee-handbook.md，Markdown）============
  - id: hr-001
    category: factual
    difficulty: L1
    question: 员工累计工作满 8 年，每年能享受几天带薪年假？
    expected_sources: [employee-handbook.md]
    expected_facts: ["5天"]
    expected_chunk: 享受5天带薪年休假
    reference_answer: 5 天带薪年休假。

  - id: hr-002
    category: factual
    difficulty: L1
    question: 员工累计工作满 15 年，带薪年假是多少天？
    expected_sources: [employee-handbook.md]
    expected_facts: ["10天"]
    expected_chunk: 满10年不满20年的，享受10天
    reference_answer: 10 天带薪年休假。

  - id: hr-003
    category: factual
    difficulty: L1
    question: 请假需要提前多久提交申请？
    expected_sources: [employee-handbook.md]
    expected_facts: ["一个工作日"]
    expected_chunk: 至少提前一个工作日
    reference_answer: 至少提前一个工作日提交申请。

  - id: hr-004
    category: factual
    difficulty: L1
    question: 遇到紧急情况无法提前请假时应该怎么做？
    expected_sources: [employee-handbook.md]
    expected_facts: ["电话", "补交"]
    expected_chunk: 紧急情况可先电话告知主管
    reference_answer: 先电话告知主管，并在恢复工作后补交申请。

  - id: hr-101
    category: factual
    difficulty: L2
    question: 我累计工作满 12 年了，今年能休几天带薪年假？
    expected_sources: [employee-handbook.md]
    expected_facts: ["10天"]
    expected_chunk: 满10年不满20年的，享受10天
    reference_answer: 10 天带薪年休假。

  - id: hr-102
    category: factual
    difficulty: L2
    question: 想请年假的话，需要预留多长时间提交申请？
    expected_sources: [employee-handbook.md]
    expected_facts: ["一个工作日"]
    expected_chunk: 至少提前一个工作日
    reference_answer: 至少提前一个工作日。

  - id: hr-103
    category: factual
    difficulty: L2
    question: 突然生病没办法提前请假，公司规定怎么处理？
    expected_sources: [employee-handbook.md]
    expected_facts: ["电话", "补交"]
    expected_chunk: 紧急情况可先电话告知主管
    reference_answer: 先电话告知主管，并在恢复工作后补交申请。

  - id: hr-104
    category: factual
    difficulty: L3
    question: 员工累计工作满 20 年，带薪年假是多少天？
    expected_sources: [employee-handbook.md]
    expected_facts: ["15天"]
    expected_chunk: 满20年的，享受15天
    reference_answer: 15 天带薪年休假。

  - id: hr-105
    category: factual
    difficulty: L3
    question: 累计工作满 10 年但不满 20 年的员工，年假标准是什么？
    expected_sources: [employee-handbook.md]
    expected_facts: ["10天"]
    expected_chunk: 满10年不满20年的，享受10天
    reference_answer: 10 天带薪年休假。

  - id: hr-106
    category: factual
    difficulty: L1
    question: 标准工作时间的起止是几点？
    expected_sources: [employee-handbook.md]
    expected_facts: ["9:00"]
    expected_chunk: 9:00-18:00
    reference_answer: 周一至周五 9:00-18:00。

  - id: hr-107
    category: factual
    difficulty: L1
    question: 婚假有多少天？
    expected_sources: [employee-handbook.md]
    expected_facts: ["3天"]
    expected_chunk: 婚假3天
    reference_answer: 3 天。

  - id: hr-108
    category: factual
    difficulty: L2
    question: 正式员工离职需要提前多久书面通知公司？
    expected_sources: [employee-handbook.md]
    expected_facts: ["30天"]
    expected_chunk: 提前30天书面通知
    reference_answer: 30 天。

  - id: hr-109
    category: factual
    difficulty: L3
    question: 连续病假超过多少天需要提供二级以上医院证明？
    expected_sources: [employee-handbook.md]
    expected_facts: ["二级以上医院"]
    expected_chunk: 连续病假超过3天的
    reference_answer: 3 天，须提供二级以上医院证明。

